aid: orna-therapeutics
name: Orna Therapeutics
description: >-
  Orna Therapeutics is a Cambridge, Massachusetts biotechnology company, founded in 2019 on research
  from MIT and built by MPM Capital, that engineers circular RNA (oRNA) paired with lipid
  nanoparticle delivery so a patient's own body generates cell therapies — its lead program ORN-252
  is a CD19-targeting in vivo CAR-T designed for B-cell-driven autoimmune disease. Orna acquired
  ReNAgade Therapeutics in 2024, combining its circular RNA platform with ReNAgade's LNP delivery and
  RNA editing capabilities, and Eli Lilly announced a definitive agreement to acquire Orna on
  2026-02-09 for up to $2.4B. Orna is a therapeutics developer, not a software vendor: it publishes
  no API, developer portal, SDK or machine-readable contract, and as of this profile its own domain
  ornatx.com redirects in whole to Eli Lilly's subsidiaries page.
